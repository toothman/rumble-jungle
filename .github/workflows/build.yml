# Builds the firmware on every push and pull request.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        idf_version: [v5.4, v5.5]
    steps:
      - uses: actions/checkout@v4

      - name: Use example configuration
        run: cp main/config.example.h main/config.h

      - name: Build with ESP-IDF ${{ matrix.idf_version }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: esp32p4
          path: .
